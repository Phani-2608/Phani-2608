name: RetailRocket sampled real-data recommendation benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailrocket-sample-benchmark.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio-projects/decision-intelligence-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: portfolio-projects/decision-intelligence-platform/requirements.txt
      - run: pip install -r requirements.txt
      - name: Download public RetailRocket event data onto ephemeral runner
        run: |
          mkdir -p private-datasets reports
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://huggingface.co/datasets/DanielKiani/RetailRocket-Recommender-Data/resolve/main/data/RetailRocket-Recommender-Data/data/events.csv?download=true' \
            -o private-datasets/events.csv
          python -c "import pandas as pd; p=pd.read_csv('private-datasets/events.csv',nrows=5); assert {'timestamp','visitorid','event','itemid'}.issubset(p.columns); print(p.columns.tolist())"
      - name: Train and evaluate a bounded subset of real events
        run: |
          PYTHONPATH=. python -m scripts.benchmark_public_datasets retailrocket private-datasets/events.csv \
            --max-users 200 > reports/retailrocket_200_users.json
          sha256sum private-datasets/events.csv > reports/data_source.sha256
          python -m json.tool reports/retailrocket_200_users.json
      - uses: actions/upload-artifact@v4
        with:
          name: retailrocket-sampled-benchmark
          path: |
            portfolio-projects/decision-intelligence-platform/reports/retailrocket_200_users.json
            portfolio-projects/decision-intelligence-platform/reports/data_source.sha256
          if-no-files-found: error
          retention-days: 30
