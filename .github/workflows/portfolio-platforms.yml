name: Portfolio platforms CI
on:
  push:
    paths:
      - 'portfolio-projects/**'
      - '.github/workflows/portfolio-platforms.yml'
  pull_request:
    paths:
      - 'portfolio-projects/**'
      - '.github/workflows/portfolio-platforms.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [enterprise-agent-platform, decision-intelligence-platform]
    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: portfolio-projects/${{ matrix.project }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q
      - if: matrix.project == 'enterprise-agent-platform'
        run: PYTHONPATH=. python -m eval.run_eval
      - if: matrix.project == 'decision-intelligence-platform'
        run: PYTHONPATH=. python -m scripts.train
